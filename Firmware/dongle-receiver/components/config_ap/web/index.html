<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ESP32-S3 Dongle Config</title>
    <style>
        body { font-family: monospace; background: #121212; color: #00ff66; padding: 20px; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        button { background: #00ff66; color: #000; font-weight: bold; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>ESP32-S3 Kalibrasyon Arayüzü</h2>
    <div class="card">
        <h3>Canlı ADC Verisi:</h3>
        <p id="adc">Bekleniyor...</p>
        <button onclick="send('get_adc')">ADC Akışını Başlat</button>
        <button onclick="send('stop_adc')">Durdur</button>
    </div>
    <button onclick="send('exit')" style="background:#ff3333; color:#fff;">Kaydet & Çık</button>

    <script>
        let ws = new WebSocket(`ws://${location.host}/ws`);
        ws.onopen = () => console.log("WebSocket Bağlandı");
        ws.onmessage = (e) => {
            if (e.data.startsWith("adc:")) {
                document.getElementById("adc").innerText = e.data.replace("adc:", "");
            }
        };
        function send(cmd) { ws.send(cmd); }
    </script>
</body>
</html>
